[project]
name = "mcp-uw-workbench"
version = "0.1.0"
description = "Multi-MCP underwriting workbench - reference architecture for agent-to-agent orchestration in insurance"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sachin Singh" }
]
keywords = ["mcp", "model-context-protocol", "agentic-ai", "langgraph", "insurance", "underwriting", "a2a"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=2.0.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0",
    "anyio>=4.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
risk-mcp = "mcp_uw_workbench.risk.server:main"
pricing-mcp = "mcp_uw_workbench.pricing.server:main"
underwriting-mcp = "mcp_uw_workbench.underwriting.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_uw_workbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: spawns real MCP subprocesses (slower)",
]
timeout = 120
